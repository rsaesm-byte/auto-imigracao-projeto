{% from "_icons.html" import icon %}
<button type="button" class="chat-fab" id="chatFab" aria-label="{{ t('chat_fab_label') }}" aria-expanded="false">
  <svg width="34" height="34" viewBox="1 3 54 58.5" aria-hidden="true">
    <clipPath id="chatFabFrameClip"><rect x="4" y="6" width="48" height="34" rx="4"/></clipPath>
    <g clip-path="url(#chatFabFrameClip)">
      <rect x="4" y="6" width="48" height="34" fill="#37474F"/>
      <rect x="42" y="6" width="10" height="34" fill="#2C3940"/>
      <rect x="7" y="9" width="42" height="28" fill="#86C5F0"/>
      <rect x="40" y="9" width="9" height="28" fill="#66A8D8"/>
    </g>
    <path d="M25 44l-2 9.5h10l-2-9.5z" fill="#ECEFF1"/>
    <rect x="16" y="53.5" width="24" height="5" rx="2.5" fill="#DDE3E6"/>
    <g clip-path="url(#chatFabFrameClip)">
      <ellipse cx="18" cy="17" rx="6.4" ry="5.2" fill="#37474F"/>
      <circle cx="18" cy="20.5" r="5.3" fill="#FFD9A8"/>
      <path d="M8.5 37c0-5.8 4.2-10 9.5-10s9.5 4.2 9.5 10" fill="#E9328F"/>
      <circle cx="14.5" cy="32.5" r="1.1" fill="#2C3940"/>
      <circle cx="21.5" cy="32.5" r="1.1" fill="#2C3940"/>
    </g>
    <path d="M32 23.5l-1.8 3.6 4.3-2.1z" fill="#E0A030"/>
    <rect x="32.5" y="13.5" width="14" height="11.5" rx="3.2" fill="#E0A030"/>
    <path d="M31 22.5l-1.8 3.6 4.3-2.1z" fill="#FFCB4C"/>
    <rect x="31.5" y="12.5" width="14" height="11.5" rx="3.2" fill="#FFCB4C"/>
    <text x="38.5" y="21.8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="900" fill="#2C3940" text-anchor="middle">?</text>
  </svg>
</button>

<div class="chat-panel" id="chatPanel" hidden>
  <div class="chat-panel-header">
    <span>{{ t('chat_fab_label') }}</span>
    <button type="button" class="chat-panel-close" id="chatClose" aria-label="Close">&times;</button>
  </div>
  <p class="chat-disclaimer">{{ t('chat_disclaimer') }}</p>
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-input-row" id="chatForm">
    <input type="text" id="chatInput" placeholder="{{ t('chat_placeholder') }}" autocomplete="off">
    <button type="submit" class="btn" id="chatSendBtn">{{ t('chat_send') }}</button>
  </form>
</div>

<script>
(function () {
  var fab = document.getElementById('chatFab');
  var panel = document.getElementById('chatPanel');
  var closeBtn = document.getElementById('chatClose');
  var form = document.getElementById('chatForm');
  var input = document.getElementById('chatInput');
  var log = document.getElementById('chatLog');
  var sendBtn = document.getElementById('chatSendBtn');

  function toggle(open) {
    panel.hidden = !open;
    fab.setAttribute('aria-expanded', String(open));
    if (open) { input.focus(); }
  }

  fab.addEventListener('click', function () { toggle(panel.hidden); });
  closeBtn.addEventListener('click', function () { toggle(false); });

  function addMessage(role, text) {
    var div = document.createElement('div');
    div.className = 'chat-msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var message = input.value.trim();
    if (!message) return;

    addMessage('user', message);
    input.value = '';
    sendBtn.disabled = true;
    var typing = addMessage('bot', '…');

    var context = window.CHAT_CONTEXT || {};
    fetch('{{ url_for("chatbot.send_message") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: message,
        submission_id: context.submission_id || null,
        question_id: context.question_id || null
      })
    })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        typing.textContent = data.reply || '';
      })
      .catch(function () {
        typing.textContent = {{ t('chat_error_generic') | tojson }};
      })
      .finally(function () {
        sendBtn.disabled = false;
        log.scrollTop = log.scrollHeight;
      });
  });
})();
</script>
