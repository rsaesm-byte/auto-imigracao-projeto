{% extends "staff_base.html" %}
{% block title %}Staff — Novo cliente de coaching{% endblock %}
{% block content %}
<div class="card hero">
  <h1>Novo cliente de coaching financeiro</h1>
</div>
<div class="card">
  <form method="post" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;">
    <div>
      <label class="muted">Nome</label><br>
      <input type="text" name="full_name" required>
    </div>
    <div>
      <label class="muted">E-mail</label><br>
      <input type="email" name="email">
    </div>
    <div>
      <label class="muted">Telefone</label><br>
      <input type="text" name="phone_number">
    </div>
    <div>
      <label class="muted">Tipo de programa</label><br>
      <select name="program_type">
        <option value="">—</option>
        {% for p in program_types %}<option value="{{ p.value }}">{{ p.value|replace('_',' ')|title }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="muted">Origem</label><br>
      <select name="lead_source_id">
        <option value="">—</option>
        {% for s in sources %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit" class="icon-btn" style="background:none;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);cursor:pointer;font-size:0.82rem;padding:8px 14px;">Cadastrar</button>
  </form>
</div>
{% endblock %}
