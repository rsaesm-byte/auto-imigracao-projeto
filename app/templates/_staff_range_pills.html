{% macro range_pills(endpoint, range_key, range_labels) %}
<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
  {% for key, label in range_labels.items() %}
  <a href="{{ url_for(endpoint, range=key) }}" style="padding:6px 14px;border-radius:999px;font-size:0.82rem;font-weight:600;text-decoration:none;border:1px solid var(--border);{{ 'background:var(--accent);color:#fff;border-color:var(--accent);' if range_key == key else 'color:var(--text);' }}">{{ label }}</a>
  {% endfor %}
</div>
{% endmacro %}
